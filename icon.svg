<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="#ffffff"/>

  <!-- side buttons -->
  <rect x="12" y="19" width="13" height="13" rx="3" fill="#322f2b" transform="rotate(-35 18.5 25.5)"/>
  <rect x="75" y="19" width="13" height="13" rx="3" fill="#322f2b" transform="rotate(35 81.5 25.5)"/>

  <!-- crown button -->
  <rect x="41" y="4" width="18" height="13" rx="3" fill="#d1272f"/>

  <!-- case -->
  <circle cx="50" cy="58" r="40" fill="#322f2b"/>
  <circle cx="50" cy="58" r="40" fill="none" stroke="#56514a" stroke-width="2"/>

  <!-- LCD face -->
  <circle cx="50" cy="58" r="30" fill="#c7cfbd"/>

  <!-- ticks -->
  <g stroke="#383f31" stroke-width="2.5" stroke-linecap="round">
    <line x1="50" y1="30" x2="50" y2="35"/>
    <line x1="50" y1="81" x2="50" y2="86"/>
    <line x1="22" y1="58" x2="27" y2="58"/>
    <line x1="73" y1="58" x2="78" y2="58"/>
  </g>

  <!-- hands -->
  <line x1="50" y1="58" x2="50" y2="39" stroke="#383f31" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="50" y1="58" x2="65" y2="58" stroke="#383f31" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="50" cy="58" r="4" fill="#d1272f"/>
</svg>

<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>ストップウォッチ</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>ストップウォッチ</h1>
      <button id="settingsBtn" class="icon-btn" title="スプレッドシート設定" aria-label="設定">⚙</button>
    </header>

    <div id="stopwatchList" class="stopwatch-list"></div>
  </div>

  <template id="stopwatchTemplate">
    <section class="stopwatch-card">
      <div class="sw-header">
        <span class="sw-label"></span>
        <div class="sw-actions">
          <button type="button" class="btn btn-ghost btn-sm sw-duplicate">複製</button>
          <button type="button" class="btn btn-ghost btn-sm sw-remove">削除</button>
        </div>
      </div>

      <div class="timer-panel">
        <div class="display">00:00.00</div>

        <div class="controls">
          <div class="start-stop-col">
            <button type="button" class="btn btn-primary sw-start">スタート</button>
            <button type="button" class="btn btn-danger sw-stop" disabled>ストップ</button>
          </div>
          <button type="button" class="btn btn-lap sw-lap" disabled>ラップ</button>
        </div>
        <div class="controls controls-secondary">
          <button type="button" class="btn btn-ghost sw-reset">リセット</button>
          <button type="button" class="btn btn-ghost sw-export-csv">CSV保存</button>
          <button type="button" class="btn btn-ghost sw-save-sheet">
            <span class="sheet-btn-label">スプレッドシートに保存</span>
          </button>
        </div>
        <p class="status sw-status" role="status" aria-live="polite"></p>
      </div>

      <div class="records-panel">
        <div class="records-header">
          <h2>記録 <span class="count-badge sw-record-count">0</span></h2>
          <div class="legend">区間タイム / 累計タイム</div>
        </div>
        <div class="records-grid sw-records" aria-label="ラップ記録"></div>
        <p class="empty-state sw-empty-state">スタートすると、ここにラップの記録が並びます。</p>
      </div>
    </section>
  </template>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>スプレッドシート連携設定</h2>
        <button id="closeSettingsBtn" class="icon-btn" aria-label="閉じる">✕</button>
      </div>
      <div class="modal-body">
        <label for="scriptUrlInput">GAS ウェブアプリ URL</label>
        <input id="scriptUrlInput" type="text" placeholder="https://script.google.com/macros/s/xxxx/exec" />

        <label for="secretInput">合言葉(シークレット)</label>
        <input id="secretInput" type="text" placeholder="スクリプト側と同じ文字列" />

        <label for="sheetNameInput">シート名</label>
        <input id="sheetNameInput" type="text" placeholder="シート1" value="シート1" />

        <p class="hint">
          Google Apps Script をウェブアプリとして公開し、そのURLをここに設定します。手順は README.md を参照してください。値はこのブラウザ内(localStorage)にのみ保存されます。
        </p>

        <div id="testStatus" class="auth-status"></div>

        <div class="modal-actions">
          <button id="testConnectionBtn" class="btn">接続テスト</button>
          <button id="saveSettingsBtn" class="btn btn-primary">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

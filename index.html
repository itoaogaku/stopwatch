<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>ストップウォッチ</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="global-actions">
      <button type="button" id="exportAllBtn" class="btn btn-ghost">全てCSV保存</button>
    </div>
    <div id="stopwatchList" class="stopwatch-list"></div>
  </div>

  <template id="stopwatchTemplate">
    <section class="stopwatch-card">
      <div class="sw-header">
        <span class="sw-label" contenteditable="true" spellcheck="false" title="タップして名前を編集"></span>
        <div class="sw-actions">
          <button type="button" class="btn btn-ghost btn-sm sw-duplicate">複製</button>
          <button type="button" class="btn btn-ghost btn-sm sw-remove">削除</button>
        </div>
      </div>

      <div class="watch-body">
        <div class="timer-panel">
          <div class="display-panel">
            <div class="display">00:00.00</div>
            <div class="split-columns">
              <div class="split-col">
                <div class="split-item split-item-a">
                  <span class="split-tag">A</span>
                  <span class="split-time sw-live-a">00:00.00</span>
                </div>
                <div class="latest-lane-list sw-latest-a"></div>
              </div>
              <div class="split-col">
                <div class="split-item split-item-b">
                  <span class="split-tag">B</span>
                  <span class="split-time sw-live-b">00:00.00</span>
                </div>
                <div class="latest-lane-list sw-latest-b"></div>
              </div>
            </div>
          </div>

          <div class="controls">
            <button type="button" class="btn btn-primary sw-toggle">スタート</button>
            <div class="lap-group">
              <button type="button" class="btn btn-lap sw-lap-a" disabled>Aラップ</button>
              <button type="button" class="btn btn-lap sw-lap-b" disabled>Bラップ</button>
              <button type="button" class="btn btn-lap sw-lap-both" disabled>両方</button>
            </div>
          </div>
          <div class="secondary-actions">
            <button type="button" class="btn btn-ghost sw-reset">リセット</button>
            <button type="button" class="btn btn-ghost sw-export-csv">CSV保存</button>
          </div>
          <p class="status sw-status" role="status" aria-live="polite"></p>
        </div>

        <div class="records-panel">
          <div class="records-header">
            <h2>記録</h2>
            <div class="legend">区間タイム / 累計タイム</div>
          </div>
          <div class="records-columns">
            <div class="records-col">
              <div class="records-col-head">
                <span class="col-tag col-tag-a">A</span>
                <span class="count-badge sw-count-a">0</span>
              </div>
              <div class="records-grid sw-records-a" aria-label="Aラップ記録"></div>
            </div>
            <div class="records-col">
              <div class="records-col-head">
                <span class="col-tag col-tag-b">B</span>
                <span class="count-badge sw-count-b">0</span>
              </div>
              <div class="records-grid sw-records-b" aria-label="Bラップ記録"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>

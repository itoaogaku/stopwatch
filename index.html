<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>ストップウォッチ</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>ストップウォッチ</h1>
      <button id="settingsBtn" class="icon-btn" title="スプレッドシート設定" aria-label="設定">⚙</button>
    </header>

    <section class="timer-panel">
      <div id="display" class="display">00:00.00</div>

      <div class="controls">
        <button id="startBtn" class="btn btn-primary">スタート</button>
        <button id="lapBtn" class="btn" disabled>ラップ</button>
        <button id="stopBtn" class="btn btn-danger" disabled>ストップ</button>
      </div>
      <div class="controls controls-secondary">
        <button id="resetBtn" class="btn btn-ghost">リセット</button>
        <button id="exportCsvBtn" class="btn btn-ghost">CSV保存</button>
        <button id="saveSheetBtn" class="btn btn-ghost">
          <span id="sheetBtnLabel">スプレッドシートに保存</span>
        </button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section class="records-panel">
      <div class="records-header">
        <h2>記録 <span id="recordCount" class="count-badge">0</span></h2>
        <div class="legend">区間タイム / 累計タイム</div>
      </div>
      <div id="records" class="records-grid" aria-label="ラップ記録"></div>
      <p id="emptyState" class="empty-state">スタートすると、ここにラップの記録が並びます。</p>
    </section>
  </div>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>スプレッドシート連携設定</h2>
        <button id="closeSettingsBtn" class="icon-btn" aria-label="閉じる">✕</button>
      </div>
      <div class="modal-body">
        <label for="scriptUrlInput">GAS ウェブアプリ URL</label>
        <input id="scriptUrlInput" type="text" placeholder="https://script.google.com/macros/s/xxxx/exec" />

        <label for="secretInput">合言葉(シークレット)</label>
        <input id="secretInput" type="text" placeholder="スクリプト側と同じ文字列" />

        <label for="sheetNameInput">シート名</label>
        <input id="sheetNameInput" type="text" placeholder="シート1" value="シート1" />

        <p class="hint">
          Google Apps Script をウェブアプリとして公開し、そのURLをここに設定します。手順は README.md を参照してください。値はこのブラウザ内(localStorage)にのみ保存されます。
        </p>

        <div id="testStatus" class="auth-status"></div>

        <div class="modal-actions">
          <button id="testConnectionBtn" class="btn">接続テスト</button>
          <button id="saveSettingsBtn" class="btn btn-primary">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
